<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>接收文件 - JiahaoDrop</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="receive-body">
    <header class="receive-topbar">
      <a class="brand" href="/" aria-label="JiahaoDrop 首页">
        <span class="logo" aria-hidden="true"><span></span></span>
        <strong data-brand="siteName" data-suffix=" 快传">JiahaoDrop 快传</strong>
      </a>
      <button class="theme-toggle" type="button" aria-label="切换主题"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <a class="home-login-btn" href="/login">登录</a>
    </header>

    <main class="receive-screen">
      <div class="receive-card" id="receiveCard">
        <div class="receive-loading" id="loadingState">
          <p>正在查询文件...</p>
        </div>

        <div id="fileInfo" hidden>
          <div class="file-icon" id="fileIcon">📄</div>
          <h2 id="fileName"></h2>
          <div class="file-meta" id="fileMeta"></div>
          <a class="primary" id="downloadBtn" href="#">下载文件</a>
        </div>

        <div class="receive-error" id="errorState" hidden>
          <div class="file-icon">❌</div>
          <h2 id="errorTitle">文件不存在</h2>
          <p id="errorMsg"></p>
        </div>

        <div class="receive-other">
          <p>输入其他接收码</p>
          <form class="receive-other-form" id="otherCodeForm">
            <input id="otherCodeInput" placeholder="例如 8H2K9M" maxlength="6" autocomplete="off" spellcheck="false">
            <button class="small-btn" type="submit">查询</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer" data-brand="icp">豫ICP备2023027149号-2</footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/shared.js" defer></script>
    <script src="/receive.js" defer></script>
  </body>
</html>
