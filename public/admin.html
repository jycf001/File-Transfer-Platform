<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JiahaoDrop 管理后台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="admin-body">
    <header class="topbar admin-topbar">
      <a class="back-icon" href="/app/send" aria-label="返回用户端">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <a class="brand" href="/admin" aria-label="JiahaoDrop 管理后台">
        <span class="logo" aria-hidden="true"><span></span></span>
        <strong data-brand="siteName" data-suffix=" 后台">JiahaoDrop 后台</strong>
      </a>
      <div class="notice">后台操作会写入审计日志</div>
      <button class="theme-toggle admin-theme-toggle" type="button" aria-label="切换主题"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </header>

    <main class="shell admin-shell">
      <section class="admin-layout" id="adminApp" hidden>
        <aside class="admin-sidebar" id="adminNav">
          <nav class="side-nav" aria-label="后台功能">
            <button class="nav-btn active" data-view="overview" type="button">概览</button>
            <button class="nav-btn" data-view="users" type="button">用户</button>
            <button class="nav-btn super-admin-only" data-view="settings" type="button">设置</button>
            <button class="nav-btn" data-view="logs" type="button">日志</button>
            <a class="nav-link" href="/app/send">用户端</a>
          </nav>

          <div class="sidebar-account">
            <div class="sidebar-account-row">
              <span class="avatar" id="avatar" aria-hidden="true">J</span>
              <span class="account-badge" id="accountBadge"></span>
            </div>
            <button class="nav-link logout-link" id="logoutBtn" type="button">退出登录</button>
          </div>
        </aside>

        <section class="admin-content">
          <section class="view active" id="overviewView">
            <div class="section-head">
              <div>
                <h2>运行概览</h2>
                <p>关键状态放在第一屏，便于日常巡检。</p>
              </div>
              <button class="ghost" id="refreshOverviewBtn" type="button">刷新</button>
            </div>
            <div class="metric-grid" id="metricGrid"></div>
          </section>

          <section class="view" id="usersView">
            <div class="section-head">
              <div>
                <h2>用户管理</h2>
                <p>创建账号、重置密码、禁用或删除用户。</p>
              </div>
            </div>
          <form class="admin-form" id="createUserForm">
            <input name="username" placeholder="用户名" required minlength="3" maxlength="32">
            <input name="email" placeholder="邮箱，用于登录验证码" type="email">
            <input name="password" placeholder="初始密码，至少 8 位" type="password" required minlength="8" maxlength="128">
            <select name="role">
                <option value="user">普通用户</option>
                <option value="admin" class="super-admin-only">管理员</option>
                <option value="super_admin" class="super-admin-only">超级管理员</option>
              </select>
              <button class="primary" type="submit">创建</button>
            </form>
            <div class="user-list" id="userList"></div>
          </section>

          <section class="view" id="settingsView">
            <div class="section-head">
              <div>
                <h2>系统设置</h2>
                <p>配置访问域名、文件存放目录和邮件发送服务器。</p>
              </div>
              <div class="actions">
                <button class="ghost" id="reloadSettingsBtn" type="button">重载</button>
                <button class="primary" id="saveSettingsBtn" type="button">保存设置</button>
              </div>
            </div>
            <form class="settings-form" id="settingsForm">
              <div class="settings-grid">
                <fieldset>
                  <legend>访问</legend>
                  <label>
                    公网访问域名
                    <input name="publicBaseUrl" placeholder="https://send.example.com">
                  </label>
                </fieldset>
                <fieldset>
                  <legend>存储</legend>
                  <div class="form-grid">
                    <label>
                      文件存放目录
                      <input name="storageDir" placeholder="/data/jiahaodrop/storage" required>
                    </label>
                    <label>
                      总存储空间限制（MB）
                      <input name="storageQuotaMb" type="number" min="0" max="1048576" step="1" placeholder="0 不限制">
                    </label>
                  </div>
                </fieldset>
                <fieldset>
                  <legend>上传与保留</legend>
                  <div class="form-grid">
                    <label>
                      单文件大小限制（MB）
                      <input name="maxFileSizeMb" type="number" min="1" max="10240" step="1" required>
                    </label>
                    <label>
                      单次最大上传文件数
                      <input name="maxFilesPerUpload" type="number" min="1" max="100" step="1">
                    </label>
                    <label>
                      默认保留时长（小时）
                      <input name="retentionHours" type="number" min="1" max="720" step="1">
                    </label>
                  </div>
                </fieldset>
                <fieldset>
                  <legend>会话</legend>
                  <div class="form-grid">
                    <label>
                      登录有效期（小时）
                      <input name="sessionHours" type="number" min="1" max="720" step="1">
                    </label>
                    <label>
                      空闲超时（分钟）
                      <input name="sessionIdleMinutes" type="number" min="1" max="10080" step="1">
                    </label>
                  </div>
                </fieldset>
                <fieldset>
                  <legend>用户</legend>
                  <label class="check-row">
                    <input name="registrationEnabled" type="checkbox">
                    允许用户自助注册（需先开启 SMTP 邮件）
                  </label>
                </fieldset>
                <fieldset>
                  <legend>个性化</legend>
                  <div class="form-grid">
                    <label>
                      站点名称
                      <input name="siteName" placeholder="JiahaoDrop" maxlength="30">
                    </label>
                    <label>
                      备案号
                      <input name="icpNumber" placeholder="豫ICP备XXXXXXXX号-X" maxlength="60">
                    </label>
                  </div>
                  <label>
                    提示公告
                    <input name="legalNotice" placeholder="上传违法违规内容将承担法律责任" maxlength="100">
                  </label>
                </fieldset>
                <fieldset class="settings-smtp">
                  <legend>SMTP 邮件</legend>
                  <label class="check-row">
                    <input name="smtpEnabled" type="checkbox">
                    启用邮件发送
                  </label>
                  <div class="form-grid">
                    <label>
                      SMTP 主机
                      <input name="smtpHost" placeholder="smtp.example.com">
                    </label>
                    <label>
                      端口
                      <input name="smtpPort" type="number" min="1" max="65535" value="465">
                    </label>
                    <label>
                      加密连接
                      <select name="smtpSecure">
                        <option value="true">SSL/TLS</option>
                        <option value="false">STARTTLS/明文</option>
                      </select>
                    </label>
                    <label>
                      用户名
                      <input name="smtpUsername" autocomplete="off">
                    </label>
                    <label>
                      密码
                      <input name="smtpPassword" type="password" autocomplete="new-password" placeholder="留空则不修改">
                    </label>
                    <label>
                      发件人
                      <input name="smtpFrom" placeholder="JiahaoDrop <no-reply@example.com>">
                    </label>
                  </div>
                  <label>
                    日志收件人
                    <input name="logRecipients" placeholder="admin@example.com, ops@example.com">
                  </label>
                  <div class="smtp-actions">
                    <button class="small-btn" id="testEmailBtn" type="button">发送测试邮件</button>
                  </div>
                </fieldset>
                <fieldset>
                  <legend>日志</legend>
                  <div class="form-grid">
                    <label>
                      日志留存时间（小时）
                      <input name="logRetentionHours" type="number" min="24" max="8760" step="1">
                    </label>
                    <label>
                      系统日志最大条数
                      <input name="logMaxSystem" type="number" min="50" max="5000" step="1">
                    </label>
                    <label>
                      安全日志最大条数
                      <input name="logMaxSecurity" type="number" min="50" max="5000" step="1">
                    </label>
                    <label>
                      用户日志最大条数
                      <input name="logMaxUser" type="number" min="50" max="5000" step="1">
                    </label>
                  </div>
                </fieldset>
              </div>
              <div class="settings-danger">
                <div>
                  <h4>危险操作</h4>
                  <p class="meta">恢复出厂设置将清除所有用户、文件、会话和配置，此操作不可撤销。</p>
                </div>
                <button class="danger-btn" id="resetSystemBtn" type="button">恢复出厂设置</button>
              </div>
            </form>
          </section>

          <section class="view" id="logsView">
            <div class="section-head">
              <div>
                <h2>审计日志</h2>
                <p>系统、安全、用户三类日志独立管理，可一键发送到邮箱。</p>
              </div>
              <div class="actions">
                <button class="ghost" id="emailLogsBtn" type="button">发送日志</button>
                <button class="ghost" id="refreshLogsBtn" type="button">刷新</button>
              </div>
            </div>
            <div class="log-toolbar">
              <div class="log-tabs" id="logTabs">
                <button class="log-tab active" data-category="all" type="button">全部 <span class="tab-count" id="countAll">0</span></button>
                <button class="log-tab" data-category="system" type="button">系统日志 <span class="tab-count" id="countSystem">0</span></button>
                <button class="log-tab" data-category="security" type="button">安全日志 <span class="tab-count" id="countSecurity">0</span></button>
                <button class="log-tab" data-category="user" type="button">用户日志 <span class="tab-count" id="countUser">0</span></button>
              </div>
              <div class="log-filters">
                <div class="log-search-wrap">
                  <svg class="log-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                  <input class="log-search" id="logSearch" type="text" placeholder="搜索操作、用户、IP、详情...">
                </div>
                <select class="log-filter-select" id="logLevelFilter">
                  <option value="">全部级别</option>
                  <option value="info">正常</option>
                  <option value="warn">警告</option>
                </select>
                <select class="log-filter-select" id="logTimeFilter">
                  <option value="">全部时间</option>
                  <option value="1">最近 1 小时</option>
                  <option value="6">最近 6 小时</option>
                  <option value="24">最近 24 小时</option>
                  <option value="72">最近 3 天</option>
                  <option value="168">最近 7 天</option>
                </select>
              </div>
            </div>
            <div class="log-list" id="logList"></div>
          </section>
        </section>
      </section>
    </main>

    <footer class="site-footer" data-brand="icp">豫ICP备2023027149号-2</footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/shared.js" defer></script>
    <script src="/admin.js" defer></script>
  </body>
</html>
